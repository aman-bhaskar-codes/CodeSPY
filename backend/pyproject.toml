[project]

name = "codespy-backend"

version = "0.1.0"

description = "CodeSPY Agentic Reverse Engineering Platform — Backend API, DSA CPG Engine & Multi-Model Orchestrator"

readme = "../README.md"

requires-python = ">=3.12,<3.13"

license = { text = "MIT" }

dependencies = [

    # --- Web API, Validation & SSE Streaming ---

    "fastapi>=0.115.0",

    "uvicorn[standard]>=0.32.0",

    "pydantic>=2.10.0",

    "pydantic-settings>=2.6.0",

    "email-validator>=2.2.0",

    "python-multipart>=0.0.18",

    "httpx>=0.28.0",

    "sse-starlette>=2.1.3",

    # --- Database, Async ORM, Migrations & Vector Search ---

    "sqlalchemy[asyncio]>=2.0.36",

    "asyncpg>=0.30.0",

    "psycopg[binary]>=3.2.3",

    "alembic>=1.14.0",

    "pgvector>=0.3.6",

    # --- Caching, Distributed Queues & AWS SDK ---

    "redis[hiredis]>=5.2.0",

    "arq>=0.26.1",

    "boto3>=1.35.0",

    "aioboto3>=13.2.0",

    # --- AI Frontier APIs, MCP Server & Token Budgeting ---

    "anthropic>=0.40.0",

    "google-genai>=1.0.0",

    "mcp>=1.1.0",

    "tiktoken>=0.8.0",

    "tenacity>=9.0.0",

    # --- DSA, AST/CPG Parsing, Git & Scientific Graph Ops ---

    "tree-sitter==0.26.0",

    "tree-sitter-python==0.25.0",

    "tree-sitter-javascript==0.25.0",

    "tree-sitter-typescript==0.23.2",

    "tree-sitter-language-pack>=0.6.0",

    "networkx>=3.4.2",

    "numpy>=2.1.3",

    "pygit2>=1.16.0",

    "GitPython>=3.1.43",

    # --- Free Browser Automation & Outer Search Environment ---

    "playwright>=1.49.0",

    "duckduckgo-search>=6.3.7",
    "ddgs",

    "trafilatura>=2.0.0",

    "beautifulsoup4>=4.12.3",

    "lxml>=5.3.0",

    # --- Security, Auth, Cryptography & Upload Validation ---

    "pyjwt[crypto]>=2.10.0",

    "pwdlib[argon2]>=0.2.1",

    "authlib>=1.3.2",

    "python-magic>=0.4.27",

    "cryptography>=44.0.0",

    # --- Observability, Tracing & Structured Logging ---

    "structlog>=24.4.0",

    "opentelemetry-api>=1.28.0",

    "opentelemetry-sdk>=1.28.0",

    "opentelemetry-instrumentation-fastapi>=0.49b0",

    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",

    "opentelemetry-instrumentation-httpx>=0.49b0",

    "langfuse>=2.55.0",

]

[dependency-groups]

dev = [

    # --- Testing & Property-Based Verification ---

    "pytest>=8.3.4",

    "pytest-asyncio>=0.24.0",

    "pytest-cov>=6.0.0",

    "pytest-mock>=3.14.0",

    "hypothesis>=6.122.0",

    "aiosqlite>=0.20.0",

    # --- Linting, Formatting, Strict Type Checking & Security Audits ---

    "ruff>=0.8.2",

    "mypy>=1.13.0",

    "bandit[toml]>=1.8.0",

    "pre-commit>=4.0.1",

    "types-redis>=4.6.0",
    "debugpy",
    "pip-audit",
    "boto3-stubs[essential]",

]

[tool.ruff]

target-version = "py312"

line-length = 100

src = ["app", "tests"]

[tool.ruff.lint]

select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "SIM", "RUF"]

ignore = ["S101"]

[tool.mypy]

python_version = "3.12"

strict = true

warn_return_any = true

warn_unused_configs = true

disallow_untyped_defs = true

plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]

asyncio_mode = "auto"
pythonpath = [".", ".."]
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = ["integration: real PostgreSQL", "concurrency: coordinated independent connections", "performance: dedicated large fixture"]

testpaths = ["tests"]

addopts = "-ra -q --strict-markers"

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
"app/domain/errors.py" = ["N818"] # Public error names are specified by the phase contract.
"tests/unit/test_foundation.py" = ["S105", "S106"] # Synthetic URL escaping fixture.
