name: Workspace dependency graph
on:
  push:
    branches: [main]
    paths:
      [
        uv.lock,
        scripts/dependency_snapshot.py,
        .github/workflows/dependency-snapshot.yml,
      ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  root-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/dependency_snapshot.py --output work/dependencies.json
      - run: gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input work/dependencies.json
        env:
          GH_TOKEN: ${{ github.token }}
